jobs:
  - job: SecurityScanJob
    displayName: "Gitleaks, Checkov & Trivy Security Scans"
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - script: |
          echo "Installing Gitleaks..."
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --verbose --redact
        displayName: "Run Gitleaks Secret Scanner"

      - script: |
          pip install checkov
          checkov -d sample-workload --framework terraform --output cli --soft-fail
        displayName: "Run Checkov Static Analysis (SAST)"

      - script: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy config sample-workload --severity HIGH,CRITICAL --exit-code 0
        displayName: "Run Trivy Misconfiguration Scan"
